# Desktop Scoreboard Configuration

# MQTT Configuration
mqtt:
  broker_host: localhost
  broker_port: 1883
  client_id: scoreboard
  username: null  # Set to username if authentication required
  password: null  # Set to password if authentication required
  subscriptions:
    - scoreboard/data
    - scoreboard/text
    - scoreboard/control

# LED Matrix Configuration
matrix:
  width: 64
  height: 32
  brightness: 99
  gpio_slowdown: 10
  hardware_mapping: regular  # Regular GPIO mapping
  chain_length: 4
  parallel: 1
  assets_dir: /home/techserv/Desktop-Scoreboard/Assets  # Explicit path for Cubs/base PNG assets
  use_cubs_template: false  # Keep false to avoid showing the CUBS example background image
  led_rgb_sequence: RBG
  title_text: PURCELL  # Header above center clock in scoreboard data view

# Display Configuration
display:
  default_text_color: [255, 0, 0]  # RGB red
  default_bg_color: [0, 0, 0]      # RGB black

# Application Configuration
app:
  log_level: INFO
  mock_hardware: false  # Set to true to test without hardware
  main_loop_sleep_seconds: 0.005  # Lower for faster animation updates

# Mode Management
modes:
  default_mode: crown  # scoreboard | clock | rss | cubs | crown

# Clock Display Configuration
clock:
  enabled: true
  format: "%H:%M:%S"
  color: [255, 255, 0]  # Clock font/text color (RGB)
  font_size: 30  # Clock font size in pixels; adjust for readability/layout
  idle_after_seconds: 60  # Hold MQTT text/data this many seconds before clock returns
  weather:
    enabled: true
    latitude: 41.7056   # Notre Dame, IN
    longitude: -86.2353
    unit: F
    color: [0, 102, 255]  # Temperature text color (blue)
    refresh_seconds: 600  # Re-fetch every 10 minutes
    timeout_seconds: 2.5

# RSS Ticker Mode
rss:
  feed_url: https://www.espn.com/espn/rss/news
  refresh_seconds: 300
  timeout_seconds: 4.0
  scroll_step: 1
  frame_interval_seconds: 0.01
  scroll_pixels_per_second: 100  # Explicit speed target; higher is faster
  max_elapsed_factor: 2.0  # Caps catch-up jumps if the process is briefly delayed
  ticker_gap: 24
  color: [255, 255, 255]
  font_size: 20
  fallback_text: "RSS: waiting for headlines"

# Cubs Live Game Mode (MLB Stats API)
cubs:
  team_id: 112  # Chicago Cubs
  refresh_seconds: 5
  timeout_seconds: 4.0
  off_day_text: "No Cubs Game Today"
  show_when_final: true

# Crown Amplifier Live Meter Mode
crown:
  enabled: true  # Keep true while validating Crown feed diagnostics
  meter_topic: scoreboard/crown/meter
  udp_enabled: true
  udp_bind_host: 0.0.0.0
  udp_bind_port: 3804
  subscribe_enabled: true
  subscribe_host: 10.255.40.23
  subscribe_transport: tcp  # udp (legacy) or tcp (HiQnet guide path)
  subscribe_tcp_persistent: true
  source_node: 51
  tcp_keepalive_interval_seconds: 5.0
  subscribe_port: 3804
  subscribe_interval_seconds: 2.0
  subscribe_payload_hex: "02,19,00,00,00,2B,00,33,00,00,00,00,0E,EC,00,10,17,01,01,0F,00,20,05,00,00,00,01,00,00,00,00,33,00,10,17,01,00,00,00,00,00,00,00"
  input_subscribe_payload_hex: "02,19,00,00,00,2B,00,33,00,00,00,00,0E,EC,00,01,08,01,01,0F,00,20,05,00,00,00,01,00,00,00,00,33,00,01,08,01,00,00,00,00,00,00,00"
  target_object_id: "16.23.1"  # HiQnet object to decode (matches 0x00101701)
  input_target_object_id: "1.8.1"  # Analog input meter object base (1.8.1..1.8.4)
  display_channel_count: 4  # Render channels 16.23.1 through 16.23.4
  meter_color: [0, 0, 255]  # Output meter color (blue)
  input_meter_color: [0, 255, 0]  # Input meter color (green)
  subscribe_use_subscribe_all_sensor: true
  subscribe_sensor_change_type: 2
  subscribe_sensor_rate_ms: 50
  subscribe_initial_update: 1
  subscribe_legacy_fallback_on_stale: true
  subscribe_legacy_fallback_after_seconds: 2.5
  subscribe_tcp_assist_on_stale: true
  subscribe_tcp_assist_after_seconds: 3.0
  udp_hex_byte_index: 0  # Which parsed hex byte maps to this single meter
  meter_min_db: -40.0
  meter_max_db: 0.0
  meter_calibration_db: -14.0  # Shift decoded meter values to align with amp front-panel dB reference
  meter_smoothing_alpha: 0.30  # 0=no smoothing, 1=no smoothing memory (instant)
  marker_channel_id: 3  # 0 = auto-select most dynamic marker channel
  marker_offset_db: 48.0
  marker_scale: 1.0  # >1.0 expands movement if marker values are clustered near 0 dB
  marker_activity_log_interval_seconds: 2.0  # DEBUG: logs top moving marker signatures
  probe_all_float_offsets: false  # DEBUG: scan all 4-byte windows for plausible float meter candidates
  probe_use_best_offset: false  # Use the most active float offset as meter source
  probe_log_interval_seconds: 2.0
  probe_min_activity: 0.01
  prefer_hiqnet_frame_over_marker: true
  allow_marker_fallback: false
  udp_stats_log_interval_seconds: 2.0
  use_london_meter_scaling: false  # Soundweb London raw/10000 conversion; usually false for Crown streams
  target_param_id: 6  # preferred param in 0x0101 updates (e.g., 6=Power, 4=RMS Amp, 1=RMS Level)
  input_target_param_id: 1  # preferred param for analog input objects (1.8.x)
  frame_interval_seconds: 0.06
  stale_after_seconds: 5.0
  fallback_to_scoreboard_on_stale: false
  waiting_text: "CROWN WAIT"
